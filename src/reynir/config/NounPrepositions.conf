# Nouns and the prepositions that follow them as part of their noun
# phrase, in the format of NounPredicates.conf:
#
#   noun  /preposition case
#
# This file is generated; hand-written entries belong in
# NounPredicates.conf. It has two sources:
#
# 1. Sentences of news articles (about 1 million, from 2024 to 2026),
#    parsed with Greynir. A pair is taken from a subject that stands
#    before the verb of its clause, where the phrase directly follows the
#    head noun ('Áhrif á heilsuna eru mikil'): there is no verb that the
#    phrase could belong to instead. Pairs seen at least twice are kept.
#    The lemma of a compound word is that of its last part.
#
# 2. The development set of the gold standard of GreynirCorpus (4,500
#    hand-corrected trees): pairs where the phrase after the noun is
#    attached to the noun more often than to a verb.
#
# The case is that of the preposition; the cases that make up at least
# 15% of the occurrences of a pair are listed.
#
# The generated entries were audited in November 2026, and these were
# removed:
#
# - those on words that are seldom nouns ('ekki /í', 'var /að', 'sig /á',
#   'á /meðal'): they came from sentences where such a word was wrongly
#   read as a noun, and rewarded that reading;
# - those of nouns of time with 'í' and 'á' ('ár /í', 'vika /á'), where
#   the phrase mostly belongs to the verb;
# - those of nouns in fixed phrases ('ljós /í': 'kom í ljós í gær';
#   'staður /til': 'til staðar í kjötinu');
# - those that could never match: lemmas that BÍN does not have as
#   nouns (word forms, compounds that BÍN has no entry for, names in
#   lower case). Sixteen of the names got their capital letter instead.
#
# If the file is generated again, the same has to be done again.

